# Local PostgreSQL for development. A hosted database can be used later by setting DATABASE_URL.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zestora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]   # 5433 so it does not clash with a local PostgreSQL on 5432
    volumes: [zestora-pg:/var/lib/postgresql/data]
volumes:
  zestora-pg:
